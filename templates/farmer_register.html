<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - FarmerQueue</title>
</head>

<body>

    <h1>🌾 Farmer Registration</h1>

    <form method="POST" action="/farmer-register">

        <label for="name">Farmer Name:</label><br>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="phone">Mobile Number:</label><br>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="village">Village:</label><br>
        <input type="text" id="village" name="village" required>
        <br><br>

        <label for="district">District:</label><br>
        <input type="text" id="district" name="district" required>
        <br><br>

        <label for="state">State:</label><br>
        <input type="text" id="state" name="state" required>
        <br><br>

        <label for="centre">Preferred Procurement Centre:</label><br>
        <input type="text" id="centre" name="centre" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
